<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        header { background: #333; color: white; padding: 20px; text-align: center; }
        .wallet { background: #444; padding: 15px; margin-top: 10px; border-radius: 5px; display: inline-block; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .agent-card { background: white; padding: 20px; margin: 10px; border-radius: 8px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .unlocked-section { background: #e9ecef; padding: 20px; text-align: center; border-top: 2px solid #ccc; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 400px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>AI Agent Marketplace</h1>
        <div class="wallet">Balance: <span id="userBalance">100</span> Credits</div>
    </header>

    <div class="container">
        <div class="agent-card">
            <h3>Email Writer</h3>
            <button id="btn-EmailWriter" onclick="openModal('Email Writer', 10)">View Agent</button>
        </div>
        <div class="agent-card">
            <h3>Social Poster</h3>
            <button id="btn-SocialPoster" onclick="openModal('Social Poster', 15)">View Agent</button>
        </div>
        <div class="agent-card">
            <h3>Code Helper</h3>
            <button id="btn-CodeHelper" onclick="openModal('Code Helper', 20)">View Agent</button>
        </div>
    </div>

    <div class="unlocked-section">
        <h2>Your Unlocked Agents</h2>
        <div id="unlockedList">None yet.</div>
    </div>

    <div id="agentModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p>Cost: <span id="modalCost"></span> Credits</p>
            <button onclick="purchaseAgent()">Get Access</button>
            <button onclick="closeModal()" style="background:#6c757d">Close</button>
        </div>
    </div>

    <script>
        let balance = 100;
        let unlocked = [];
        let currentAgent = { name: '', cost: 0 };

        function openModal(name, cost) {
            currentAgent = { name, cost };
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalCost').innerText = cost;
            document.getElementById('agentModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('agentModal').style.display = 'none'; }

        function purchaseAgent() {
            if (unlocked.includes(currentAgent.name)) {
                alert('Already unlocked!');
                return;
            }
            if (balance >= currentAgent.cost) {
                balance -= currentAgent.cost;
                unlocked.push(currentAgent.name);
                document.getElementById('userBalance').innerText = balance;
                // Update Button Text
                let btnId = 'btn-' + currentAgent.name.replace(/\s+/g, '');
                document.getElementById(btnId).innerText = "Open Agent";
                renderUnlocked();
                closeModal();
            } else {
                alert('Not enough credits!');
            }
        }

        function renderUnlocked() {
            document.getElementById('unlockedList').innerHTML = unlocked.map(a => `<p>✅ ${a}</p>`).join('');
        }
    </script>
</body>
</html>
